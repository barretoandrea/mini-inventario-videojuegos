<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Videojuegos</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <main class="contenedor">
        <h1>Mi Inventario de Videojuegos</h1>
        <p>Registra y administra tus videojuegos.</p>
        
        <section class="tarjeta">
            <h2>Registrar videojuego</h2>
            <form id="formJuego">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" maxlength="50" required>
                
                <label for="categoria">Categoría</label>
                <select id="categoria" required>
                    <option value="">Seleccione...</option>
                    <option value="Acción">Acción</option>
                    <option value="Aventura">Aventura</option>
                    <option value="Deportes">Deportes</option>
                    <option value="Estrategia">Estrategia</option>
                    <option value="Carreras">Carreras</option>
                </select>
                
                <label for="precio">Precio</label>
                <input type="number" id="precio" min="0" required>
                
                <label for="stock">Cantidad disponible</label>
                <input type="number" id="stock" min="0" step="1" required>

                <label for="calificacion">Calificación (1 a 5)</label>
                <input type="number" id="calificacion" min="1" max="5" required>
                
                <div class="botones">
                    <button id="btnGuardar" type="submit">Agregar videojuego</button>
                    <button id="btnCancelar" type="button" class="secundario oculto">Cancelar edición</button>
                </div>
            </form>
            <p id="mensaje"></p>
        </section>

        <section class="tarjeta">
            <h2>Juegos registrados: <span id="totalJuegos">0</span></h2>
            
            <div class="filtros">
                <input type="text" id="buscador" placeholder="Buscar por nombre...">
                <select id="filtroCategoria">
                    <option value="">Todas las categorías</option>
                    <option value="Acción">Acción</option>
                    <option value="Aventura">Aventura</option>
                    <option value="Deportes">Deportes</option>
                    <option value="Estrategia">Estrategia</option>
                    <option value="Carreras">Carreras</option>
                </select>
            </div>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Calificación</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaJuegos"></tbody>
                </table>
            </div>
        </section>
    </main>
    
    <!-- ✅ CAMBIO: scripts normales en orden, sin type="module" -->
    <script src="./js/storage.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
